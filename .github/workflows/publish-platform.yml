name: publish-platform
run-name: "platform packages ${{ inputs.version }}"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dist_tag:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0)"
        required: true
        type: string
      dist_tag:
        description: "npm dist tag (e.g., beta, latest)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all platform binaries
        run: bun run build:binaries

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish platform packages
        run: |
          VERSION="${{ inputs.version }}"
          DIST_TAG="${{ inputs.dist_tag }}"
          TAG_ARG=""
          if [ -n "$DIST_TAG" ]; then
            TAG_ARG="--tag $DIST_TAG"
          fi

          for pkg in packages/*; do
            if [ -d "$pkg" ]; then
              echo "Publishing $pkg..."
              cd "$pkg"
              
              # Ensure version matches (it should, as build:binaries uses root package.json)
              # But we might be publishing an older version tag? 
              # No, we assume build:binaries uses the current package.json which should be updated by the caller workflow.
              
              # Check if already published
              PKG_NAME=$(jq -r .name package.json)
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/${PKG_NAME}/${VERSION}")
              
              if [ "$STATUS" = "200" ]; then
                echo "✓ ${PKG_NAME}@${VERSION} already published, skipping"
              else
                npm publish --access public --provenance $TAG_ARG
              fi
              
              cd ../..
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
