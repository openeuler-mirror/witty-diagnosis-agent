name: Validate

on: [push, pull_request]

jobs:
  validate-svg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r requirements.txt || true

      - name: SVG Pipeline Validation
        run: python skills/flamegraph-analysis/scripts/validate/validate_svg_pipeline.py

      - name: Full SVG Validation
        run: python skills/flamegraph-analysis/scripts/validate/full_svg_v2.py

      - name: Node Syntax Check
        run: |
          for f in flamegraph-samples/*.html; do
            echo "Checking $f..."
            python -c "
import re
with open('$f','r',encoding='utf-8') as fh:
    c = fh.read()
s = c.find('(function() {')
e = c.rfind('})();', s)
if s<0 or e<0:
    exit(1)
code = c[s+len('(function() {'):e]
with open('/tmp/check.js','w') as fw:
    fw.write(code)
" && node --check /tmp/check.js || exit 1
          done

      - name: SVG to Folded Validation
        run: |
          for f in flamegraph-samples/*.svg; do
            python -c "
import sys
sys.path.insert(0, 'skills/flamegraph-analysis/scripts/adapters')
from svg_to_folded import svg_to_folded
f,_=svg_to_folded(open('$f','r',encoding='utf-8').read())
n=len(f.strip().split(chr(10))) if f.strip() else 0
ok=n>0
print(f'{\"OK\" if ok else \"SKIP\"}: {n} lines {\"$f\"}')
" || true
          done
