<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>openEuler 运维平台 · 高保真原型</title>
<style>
  :root{
    --ink:#1b2430; --ink-2:#243140; --ink-3:#2f3f52;
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#fbfcfe;
    --border:#e2e8f0; --border-2:#eef2f7;
    --text:#1b2430; --text-2:#5a6b7b; --text-3:#8a99a8;
    --accent:#0d8b80; --accent-d:#0a6e65; --accent-soft:#e3f4f1;
    --ok:#1f9d57; --ok-soft:#e6f5ec;
    --warn:#c87f04; --warn-soft:#fdf3df;
    --danger:#d64545; --danger-soft:#fbe9e9;
    --neutral:#7b8794; --neutral-soft:#eef1f5;
    --font-ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    --font-mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(27,36,48,.04),0 4px 16px rgba(27,36,48,.06);
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--accent-d)}
  .mono{font-family:var(--font-mono)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cdd6e0;border-radius:6px;border:2px solid var(--bg)}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:.15s}
  .btn:hover{border-color:#c8d2dd;background:var(--surface-2)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
  .btn.primary:disabled{background:#b9c4cd;border-color:#b9c4cd;cursor:not-allowed}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:var(--neutral-soft)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{color:var(--danger);border-color:#f0cccc}
  .btn.danger:hover{background:var(--danger-soft)}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 70% -10%,#1e3a45 0%,var(--ink) 55%)}
  .login-card{background:var(--surface);width:380px;max-width:92vw;border-radius:14px;padding:34px 32px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#15b3a3);display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--font-mono)}
  .brand-name{font-weight:700;font-size:16px;letter-spacing:.2px}
  .login-card h1{font-size:19px;margin:18px 0 4px}
  .login-card p.sub{color:var(--text-2);margin:0 0 22px;font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
  .input,select.input,textarea.input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;color:var(--text)}
  .input:focus,textarea.input:focus,select.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea.input{resize:vertical;min-height:74px;line-height:1.5}
  .login-hint{margin-top:14px;font-size:12px;color:var(--text-3);text-align:center}

  /* ---------- App shell ---------- */
  #app{display:flex;height:100%}
  .sidebar{width:236px;flex:0 0 236px;background:var(--ink);color:#c4cfda;display:flex;flex-direction:column;padding:16px 12px}
  .sidebar .brand{padding:6px 8px 18px;color:#fff}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-group{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#6f8093;padding:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:#bcc8d4;font-size:13.5px;border:none;background:transparent;width:100%;text-align:left;transition:.13s}
  .nav-item:hover{background:var(--ink-2);color:#fff}
  .nav-item.active{background:var(--ink-3);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
  .nav-item svg{flex:0 0 18px}
  .nav-item .count{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;border-radius:20px;padding:1px 7px;font-weight:600}
  .side-foot{margin-top:auto;border-top:1px solid #2c3a49;padding-top:12px}
  .user-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px}
  .avatar{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
  .user-chip .meta{line-height:1.25}
  .user-chip .meta b{color:#fff;font-size:13px;font-weight:600}
  .user-chip .meta span{color:#7e8fa0;font-size:11.5px}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:58px;flex:0 0 58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px}
  .topbar h2{font-size:16px;margin:0;font-weight:650}
  .topbar .crumb{color:var(--text-3);font-size:13px}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .run-badge{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);background:var(--bg);border:1px solid var(--border);padding:5px 11px;border-radius:20px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--neutral)}
  .dot.run{background:var(--warn);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .content{flex:1;overflow:auto;padding:24px}
  .wrap{max-width:1060px;margin:0 auto}

  /* ---------- Generic ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
  .page-head .t{font-size:20px;font-weight:680;margin:0}
  .page-head .d{color:var(--text-2);margin:4px 0 0;font-size:13px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-pad{padding:18px 20px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar .grow{flex:1}
  .search{position:relative;flex:1;max-width:320px}
  .search input{padding-left:34px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:5px 13px;font-size:12.5px;color:var(--text-2)}
  .chip:hover{border-color:var(--accent);color:var(--accent-d);background:var(--accent-soft)}

  /* pills */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.ok{color:var(--ok);background:var(--ok-soft)}
  .pill.run{color:var(--warn);background:var(--warn-soft)}
  .pill.fail{color:var(--danger);background:var(--danger-soft)}
  .pill.queue{color:var(--neutral);background:var(--neutral-soft)}
  .tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--neutral-soft);color:var(--text-2);font-weight:500}
  .tag.online{background:var(--accent-soft);color:var(--accent-d)}
  .tag.offline{background:#eae6fb;color:#6b4fc4}

  /* task list */
  .tlist{display:flex;flex-direction:column}
  .trow{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--border-2);cursor:pointer;transition:.12s}
  .trow:last-child{border-bottom:none}
  .trow:hover{background:var(--surface-2)}
  .trow .tt{font-weight:600;font-size:14px}
  .trow .tm{color:var(--text-3);font-size:12px;margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .trow .col-main{flex:1;min-width:0}
  .trow .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-prog{width:120px;height:6px;border-radius:6px;background:var(--neutral-soft);overflow:hidden}
  .mini-prog i{display:block;height:100%;background:var(--warn);border-radius:6px;transition:width .4s}

  /* wizard */
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
  .seg button{border:none;background:transparent;padding:9px 18px;font-size:13px;color:var(--text-2);font-weight:500}
  .seg button.on{background:var(--accent);color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field-row{margin-bottom:14px}
  .field-row label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
  .req::after{content:" *";color:var(--danger)}
  .hint{font-size:12px;color:var(--text-3);margin-top:5px}
  .conn-result{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px}
  .dropzone{border:1.5px dashed #c7d2dd;border-radius:10px;padding:26px;text-align:center;color:var(--text-2);background:var(--surface-2)}
  .dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}
  .filelist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .fileitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px}
  .fileitem .x{margin-left:auto;color:var(--text-3)}

  /* stepper */
  .stepper{display:flex;align-items:center;margin:6px 0 4px}
  .step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
  .step .bub{width:26px;height:26px;border-radius:50%;background:var(--neutral-soft);color:var(--text-3);display:grid;place-items:center;font-size:12px;font-weight:600;z-index:1;border:2px solid var(--surface)}
  .step .lbl{font-size:11.5px;color:var(--text-3);margin-top:7px;text-align:center}
  .step .line{position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--neutral-soft);z-index:0}
  .step:first-child .line{display:none}
  .step.done .bub{background:var(--ok);color:#fff}
  .step.done .line{background:var(--ok)}
  .step.active .bub{background:var(--warn);color:#fff;box-shadow:0 0 0 4px var(--warn-soft)}
  .step.active .lbl{color:var(--warn);font-weight:600}
  .step.done .lbl{color:var(--text-2)}
  .prog-bar{height:8px;border-radius:8px;background:var(--neutral-soft);overflow:hidden;margin-top:18px}
  .prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#16b8a8);transition:width .5s}
  .logbox{margin-top:14px;background:#0f1822;border-radius:9px;padding:13px 15px;max-height:190px;overflow:auto}
  .logbox div{font-family:var(--font-mono);font-size:12px;color:#9fd0c8;line-height:1.7;white-space:pre-wrap}
  .logbox .t-time{color:#5d7c87}
  .collapser{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px;margin-top:12px;background:none;border:none;padding:0}

  /* report */
  .report h3{font-size:16px;margin:0 0 12px}
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .sbox{border:1px solid var(--border);border-radius:9px;padding:14px;background:var(--surface-2)}
  .sbox .k{font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px}
  .sbox .v{font-size:14px;font-weight:600;margin-top:6px}
  .sbox.rc{border-left:3px solid var(--danger)}
  .report-sec{margin-top:18px}
  .report-sec h4{font-size:13.5px;margin:0 0 8px;color:var(--text)}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:6px 16px;font-size:13px}
  .kv .key{color:var(--text-2)}
  pre.snippet{background:#0f1822;color:#9fd0c8;font-family:var(--font-mono);font-size:12px;padding:13px 15px;border-radius:9px;overflow:auto;line-height:1.65}
  .callout{background:var(--accent-soft);border:1px solid #c4e7e1;border-radius:9px;padding:13px 15px;font-size:13px;color:#0a5a52}

  /* ---------- RCA report (document style) ---------- */
  :root{--serif:Georgia,"Times New Roman","Noto Serif SC","Songti SC","SimSun",serif}
  .rca{display:grid;grid-template-columns:212px 1fr;gap:26px;align-items:start}
  .rca-toc{position:sticky;top:0;align-self:start;border-right:1px solid var(--border);padding-right:18px}
  .rca-toc .toc-h{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.5px;margin-bottom:12px}
  .rca-toc a{display:block;text-decoration:none;color:var(--text-2);font-size:12.5px;padding:5px 8px;border-radius:6px;line-height:1.4}
  .rca-toc a:hover{background:var(--surface-2);color:var(--text)}
  .rca-toc a.lv1{font-weight:600;color:var(--text);margin-top:6px;display:flex;align-items:center;gap:7px}
  .rca-toc a.lv1.first{background:var(--accent-soft);color:var(--accent-d)}
  .rca-toc a.lv2{padding-left:18px;font-size:12px;color:var(--text-3)}
  .rca-toc .tdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .rca-body{min-width:0;font-size:13.5px}
  .rca-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2.5px solid var(--ink);padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap}
  .rca-title h2{font-family:var(--serif);font-size:27px;font-weight:700;margin:0;display:flex;align-items:center;gap:12px;letter-spacing:1px}
  .rca-title .by{font-family:var(--serif);font-style:italic;color:var(--text-2);font-size:15px;white-space:nowrap}
  .rca-title .by b{font-style:normal;color:var(--ink-3)}
  .bigdot{width:18px;height:18px;border-radius:50%}
  .rca-meta{background:#eef4fb;border-radius:10px;padding:18px 22px;margin-bottom:30px;font-size:14px}
  .rca-meta .row{margin:7px 0}
  .rca-meta .mk{font-weight:700;color:var(--ink-2)}
  .rca-sec{margin-bottom:30px;scroll-margin-top:14px}
  .rca-sec .sh{display:flex;align-items:center;gap:13px;margin-bottom:16px}
  .rca-sec .ey{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-d);background:var(--accent-soft);border-radius:5px;padding:3px 7px}
  .rca-sec .sh h3{font-family:var(--serif);font-size:21px;font-weight:700;margin:0;letter-spacing:.5px}
  .rca-sub{margin:18px 0;scroll-margin-top:14px}
  .rca-sub .subh{font-family:var(--serif);font-size:15.5px;font-weight:700;color:var(--ink-2);margin:0 0 9px;padding-left:11px;border-left:3px solid var(--accent)}
  table.rca-tab{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
  table.rca-tab th,table.rca-tab td{border:1px solid var(--border);padding:10px 13px;text-align:left;vertical-align:top}
  table.rca-tab th{background:var(--surface-2);font-weight:600;color:var(--text-2);font-size:12.5px}
  table.rca-tab td.k{width:96px;background:#fafbfd;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .rca-body p{margin:9px 0;line-height:1.7}
  .rca-body ul,.rca-body ol{margin:9px 0;padding-left:22px;line-height:1.8}
  .hl{font-family:var(--font-mono);font-size:12px;background:var(--danger-soft);color:#c0392b;padding:1px 6px;border-radius:4px}
  .ok-hl{font-family:var(--font-mono);font-size:12px;background:var(--ok-soft);color:#0f7a3d;padding:1px 6px;border-radius:4px}
  .chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
  .chain .node{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:500}
  .chain .node.bad{border-color:#f0cccc;background:var(--danger-soft);color:#a02828}
  .chain .arr{color:var(--text-3);font-weight:700}
  .tl{border-left:2px solid var(--border);margin-left:6px;padding-left:0}
  .tl .ti{position:relative;padding:0 0 14px 22px}
  .tl .ti::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
  .tl .ti .tt{font-family:var(--font-mono);font-size:12px;color:var(--text-3)}
  .tl .ti .td{margin-top:2px}
  .tone{border-radius:9px;padding:12px 15px;font-size:13px;margin:10px 0;line-height:1.65}
  .tone.warn{background:var(--warn-soft);border:1px solid #ecd9a8;color:#7a5600}
  .tone.danger{background:var(--danger-soft);border:1px solid #f0cccc;color:#9a2828}
  .tone.ok{background:var(--ok-soft);border:1px solid #bfe3cd;color:#0f6e38}
  .tone.info{background:var(--accent-soft);border:1px solid #c4e7e1;color:#0a5a52}
  @media (max-width:860px){.rca{grid-template-columns:1fr}.rca-toc{display:none}}

  /* rating */
  .stars{display:flex;gap:4px}
  .star{font-size:26px;color:#d4dce4;cursor:pointer;line-height:1;transition:.1s}
  .star.on{color:#f0a900}
  .rate-tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .rate-tags .chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* chat */
  .chatwrap{display:flex;flex-direction:column;height:100%}
  .msgs{flex:1;overflow:auto;padding:6px 2px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg .ava{width:28px;height:28px;border-radius:8px;flex:0 0 28px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg.user .ava{background:var(--ink-3)}
  .msg.bot .ava{background:var(--accent)}
  .bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:13.5px}
  .msg.user .bubble{background:var(--ink);color:#eef3f7;border-color:var(--ink)}
  .typing-bub{display:inline-flex;gap:4px;align-items:center}
  .typing-bub i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:bounce 1.1s infinite}
  .typing-bub i:nth-child(2){animation-delay:.15s}.typing-bub i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
  .composer{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--border);padding-top:14px;margin-top:8px}
  .composer textarea{flex:1;min-height:42px;max-height:120px}
  .cite{margin-top:10px;border-top:1px dashed var(--border);padding-top:9px}
  .cite .ct{font-size:11.5px;color:var(--text-3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
  .cite a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;text-decoration:none;margin-right:14px}
  .intent-tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:5px;margin-bottom:8px;display:inline-block}
  .intent-tag.cve{background:var(--danger-soft);color:var(--danger)}
  .intent-tag.qa{background:var(--accent-soft);color:var(--accent-d)}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  table.data th,table.data td{border:1px solid var(--border);padding:8px 10px;text-align:left}
  table.data th{background:var(--surface-2);font-weight:600;color:var(--text-2)}
  table.data td.mono{font-family:var(--font-mono);font-size:12px}

  /* action proposal card in chat */
  .action-card{border:1px solid #e8d6ad;background:var(--warn-soft);border-radius:10px;padding:13px 15px;font-size:13px;margin-top:4px}
  .action-card .ah{font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px;color:#8a5a00}
  .action-card ul{margin:6px 0 12px;padding-left:18px;color:#6b4d12}
  .action-card .acbtns{display:flex;gap:9px}

const $ = s=>document.querySelector(s);
const C = ()=>$('#content');
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function pill(status){
  const m={completed:['ok','已完成'],running:['run','运行中'],failed:['fail','失败'],queued:['queue','排队中']};
  const [c,t]=m[status]||['queue',status]; return `<span class="pill ${c}">${t}</span>`;
}
function toast(msg){const t=$('#toast');t.innerHTML=ICON.bolt+esc(msg);t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function runningCount(){return TASKS.filter(t=>t.status==='running').length;}
function refreshRunBadge(){
  const n=runningCount();
  $('#rb-dot').className='dot'+(n?' run':'');
  $('#rb-text').textContent=n?`${n} 个任务运行中`:'无运行中任务';
  const nv=$('#nav-run'); if(n){nv.hidden=false;nv.textContent=n;}else nv.hidden=true;
}

/* ============ ROUTER / RENDER ============ */
function setView(v){
  state.view=v; state.activeTask=null; state.activeChat=null; state.kbNew=false;
  document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  render();
}
function setTitle(t,crumb=''){$('#pg-title').textContent=t;$('#pg-crumb').textContent=crumb?'/ '+crumb:'';}

function render(){
  refreshRunBadge();
  if(state.view==='ops'){ state.activeTask?renderTaskDetail():(state.wizard?renderWizard():renderOpsList()); }
  else if(state.view==='kb'){ renderKB(); }
}

/* ---- OPS LIST ---- */
function renderOpsList(){
  setTitle('故障运维');
  const rows = TASKS.map(t=>`
    <div class="trow" data-action="open-task" data-id="${t.id}">
      <div class="col-main">
        <div class="tt">${esc(t.title)}</div>
        <div class="tm">
          <span class="tag ${t.type}">${t.type==='online'?'在线':'离线'}</span>
          <span class="mono">${t.id}</span><span>·</span>
          <span>${t.type==='online'?esc(t.target):esc((t.files||[]).join(', '))}</span>
          <span>·</span><span>${t.time}</span>
        </div>
      </div>
      ${t.status==='running'?`<div class="mini-prog"><i style="width:${t.progress}%"></i></div>`:''}
      ${pill(t.status)}
      <button class="btn sm" data-action="open-task" data-id="${t.id}">查看 →</button>
    </div>`).join('');
  C().innerHTML=`
    <div class="page-head">
      <div><h1 class="t">故障运维</h1><p class="d">以任务为单元创建诊断，后台执行、实时查看进度，完成后查看报告并继续分析。</p></div>
      <button class="btn primary" data-action="new-task">${ICON.plus} 新建运维任务</button>
    </div>
    <div class="toolbar">
      <div class="search">${ICON.search}<input class="input" placeholder="搜索任务描述…"></div>
      <div class="seg"><button class="on">全部</button><button>在线</button><button>离线</button></div>
    </div>
    <div class="card"><div class="tlist">${rows}</div></div>`;
}

/* ---- WIZARD ---- */
function renderWizard(){
  setTitle('故障运维','新建任务');
  const w=state.wizard;
  const branch = w.type==='online' ? onlineForm(w) : offlineForm(w);
  C().innerHTML=`
    <div class="page-head"><div><h1 class="t">新建运维任务</h1><p class="d">填写故障信息，选择在线或离线方式进行诊断。</p></div>
      <button class="btn ghost" data-action="cancel-wizard">← 返回列表</button></div>
    <div class="card card-pad" style="margin-bottom:16px">
      <div class="field-row"><label class="req">任务描述（故障现象）</label>
        <textarea class="input" id="w-desc" placeholder="例如：02:14 起 Nginx 大量返回 502，前端下单失败…">${esc(w.desc||'')}</textarea></div>
      <div class="grid2">
        <div class="field-row"><label class="req">运维类型</label>
          <div class="seg" id="w-type">
            <button class="${w.type==='online'?'on':''}" data-action="wiz-type" data-t="online">在线诊断</button>
            <button class="${w.type==='offline'?'on':''}" data-action="wiz-type" data-t="offline">离线分析</button>
          </div>
          <div class="hint">${w.type==='online'?'连接目标主机自动采集数据':'上传已有日志进行分析'}</div>
        </div>
        <div class="field-row"><label class="req">故障时间</label>
          <input class="input" id="w-time" value="${esc(w.time||'2026-06-10 01:30')}"></div>
      </div>
    </div>
    <div class="card card-pad">${branch}</div>`;
}
function onlineForm(w){
  const connOk = w.conn==='ok';
  return `
    <h4 style="margin:0 0 14px;font-size:14px">在线诊断 · 目标主机</h4>
    <div class="grid2">
      <div class="field-row"><label class="req">主机 IP</label><input class="input mono" id="w-ip" value="${esc(w.ip||'192.168.10.21')}"></div>
      <div class="field-row"><label>SSH 端口</label><input class="input mono" id="w-port" value="22"></div>
      <div class="field-row"><label class="req">账号</label><input class="input mono" id="w-acc" value="root"></div>
      <div class="field-row"><label class="req">密码</label><input class="input" type="password" id="w-pwd" value="********"></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
      <button class="btn" data-action="test-conn" id="btn-conn">测试连通性</button>
      <div class="conn-result" id="conn-res">${connOk?'<span class="pill ok">连通成功</span><span style="color:var(--text-2)">已可执行诊断</span>':''}</div>
    </div>
    <div class="hint" style="margin-top:14px">凭据将加密存储，报告与日志中自动脱敏。<a href="#" data-action="noop">仅本次使用，不保存 →</a></div>
    <div style="margin-top:18px;border-top:1px solid var(--border-2);padding-top:16px;display:flex;gap:10px;align-items:center">
      <button class="btn primary" data-action="start-online" id="btn-start" ${connOk?'':'disabled'}>开始诊断</button>
      <span class="hint" style="margin:0">${connOk?'后台将自动采集数据并分析':'请先测试连通性，通过后方可开始'}</span>
    </div>`;
}
function offlineForm(w){
  const files=w.files||[];
  return `
    <h4 style="margin:0 0 14px;font-size:14px">离线分析 · 上传日志</h4>
    <div class="dropzone" data-action="pick-file">
      <div style="font-size:22px">📄</div>
      <div style="margin-top:8px;font-weight:600">点击此处添加日志文件</div>
      <div class="hint">支持 .log / .tar.gz / .zip（演示：点击即模拟添加一个文件）</div>
    </div>
    ${files.length?`<div class="filelist">${files.map((f,i)=>`
      <div class="fileitem">${ICON.file}<span class="mono">${esc(f)}</span><span class="hint" style="margin:0">2.3 MB</span>
      <span class="x" data-action="rm-file" data-i="${i}" style="cursor:pointer">✕</span></div>`).join('')}</div>`:''}
    <div style="margin-top:18px;border-top:1px solid var(--border-2);padding-top:16px;display:flex;gap:10px;align-items:center">
      <button class="btn primary" data-action="start-offline" ${files.length?'':'disabled'}>开始分析</button>
      <span class="hint" style="margin:0">${files.length?'后台将解析日志并定位故障':'请先添加至少一个日志文件'}</span>
    </div>`;
}

/* ---- TASK DETAIL ---- */
function renderTaskDetail(){
  const t=state.activeTask;
  setTitle('故障运维',t.id);
  let body='';
  if(t.status==='failed'){
    body=`<div class="card card-pad"><div class="callout" style="background:var(--danger-soft);border-color:#f0cccc;color:#7a2020">
      <b>诊断失败</b><br>${esc(t.fail)}</div>
      <div style="margin-top:14px;display:flex;gap:10px"><button class="btn" data-action="retry">重试</button>
      <button class="btn primary" data-action="new-task">改为离线分析</button></div></div>`;
  } else if(t.status==='running'){
    body=progressBlock(t);
  } else {
    body=progressBlock(t)+reportBlock(t)+ratingBlock(t)+followupBlock(t);
  }
  C().innerHTML=`
    <div class="page-head">
      <div><h1 class="t">${esc(t.title)}</h1>
        <p class="d"><span class="tag ${t.type}">${t.type==='online'?'在线':'离线'}</span>
        <span class="mono">${t.id}</span> · ${t.type==='online'?esc(t.target):esc((t.files||[]).join(', '))} · ${t.time} &nbsp; ${pill(t.status)}</p></div>
      <button class="btn ghost" data-action="back-list">← 返回列表</button>
    </div>${body}`;
  const lb=$('#logbox'); if(lb) lb.scrollTop=lb.scrollHeight;
}
function progressBlock(t){
  const cur=t.stageIdx??(t.status==='completed'?5:0);
  const steps=STAGES.map((s,i)=>{
    let cls=''; if(i<cur)cls='done'; else if(i===cur && t.status==='running')cls='active'; else if(t.status==='completed')cls='done';
    return `<div class="step ${cls}"><div class="line"></div><div class="bub">${(i<cur||t.status==='completed')?'✓':i+1}</div><div class="lbl">${s}</div></div>`;
  }).join('');
  const logs=(t.logs||[]).map(l=>`<div><span class="t-time">${l.time}</span>  ${esc(l.txt)}</div>`).join('');
  return `<div class="card card-pad" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h4 style="margin:0;font-size:14px">执行进度</h4>
      ${t.status==='running'?'<button class="btn sm danger" data-action="cancel-task">取消任务</button>':''}
    </div>
    <div class="stepper">${steps}</div>
    <div class="prog-bar"><i style="width:${t.progress}%"></i></div>
    ${(t.logs&&t.logs.length)?`<button class="collapser" data-action="toggle-log">▸ 实时日志（${t.logs.length}）</button>
      <div class="logbox" id="logbox" ${t._logOpen?'':'hidden'}>${logs}</div>`:''}
  </div>`;
}
function renderRcaBlock(b){
  switch(b.t){
    case 'kv': return `<table class="rca-tab"><tbody>${b.rows.map(r=>`<tr><td class="k">${esc(r[0])}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table>`;
    case 'table': return `<table class="rca-tab"><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    case 'p': return `<p>${b.html}</p>`;
    case 'ul': return `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'ol': return `<ol>${b.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
    case 'code': return `<pre class="snippet">${esc(b.text)}</pre>`;
    case 'tone': return `<div class="tone ${b.tone}">${b.html}</div>`;
    case 'chain': return `<div class="chain">${b.nodes.map((n,i)=>`${i?'<span class="arr">→</span>':''}<span class="node ${n.bad?'bad':''}">${esc(n.text)}</span>`).join('')}</div>`;
    case 'timeline': return `<div class="tl">${b.items.map(i=>`<div class="ti"><div class="tt">${esc(i.time)}</div><div class="td">${esc(i.text)}</div></div>`).join('')}</div>`;
    case 'sub': return `<div class="rca-sub" id="${b.id}"><div class="subh">${esc(b.title)}</div>${b.blocks.map(renderRcaBlock).join('')}</div>`;
    default: return '';
  }
}
function reportBlock(t){
  const r=t.report; if(!r||!r.meta) return '';
  const m=r.meta;
  const dotColor = m.dot==='red'?'var(--danger)':m.dot==='green'?'var(--ok)':'var(--warn)';
  const toc = `<a class="lv1 first" data-action="toc" data-target="rca-top"><span class="tdot" style="background:${dotColor}"></span>故障诊断报告</a>`+
    r.sections.map(s=>{
      const subs=(s.subs||[]).map(su=>`<a class="lv2" data-action="toc" data-target="${su.id}">${esc(su.label)}</a>`).join('');
      return `<a class="lv1" data-action="toc" data-target="${s.id}">${esc(s.label)}</a>${subs}`;
    }).join('');
  const body = r.sections.map(s=>`
    <div class="rca-sec" id="${s.id}">
      <div class="sh"><span class="ey">${esc(s.ey)}</span><h3>${esc(s.label)}</h3></div>
      ${s.blocks.map(renderRcaBlock).join('')}
    </div>`).join('');
  return `<div class="card card-pad" style="margin-bottom:16px">
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px">
      <button class="btn sm" data-action="noop">新窗口打开</button><button class="btn sm" data-action="noop">下载 HTML</button>
    </div>
    <div class="rca">
      <nav class="rca-toc"><div class="toc-h">目录</div>${toc}</nav>
      <div class="rca-body" id="rca-top">
        <div class="rca-title">
          <h2><span class="bigdot" style="background:${dotColor}"></span>故障诊断报告</h2>
          <div class="by">by <b>${esc(m.agent)}</b></div>
        </div>
        <div class="rca-meta">
          <div class="row"><span class="mk">报告编号：</span><span class="mono">${esc(m.id)}</span></div>
          <div class="row"><span class="mk">故障级别：</span>${esc(m.level)}</div>
          <div class="row"><span class="mk">报告时间：</span>${esc(m.time)}</div>
          <div class="row"><span class="mk">当前状态：</span><span class="bigdot" style="display:inline-block;width:11px;height:11px;vertical-align:middle;margin-right:6px;background:${dotColor}"></span>${esc(m.status)}</div>
        </div>
        ${body}
      </div>
    </div>
  </div>`;
}
function ratingBlock(t){
  const tags=['定位准确','建议可执行','已解决问题','需进一步分析'];
  const stars=[1,2,3,4,5].map(i=>`<span class="star ${i<=(t._ratingHover||t.rating)?'on':''}" data-action="set-star" data-v="${i}">★</span>`).join('');
  return `<div class="card card-pad" style="margin-bottom:16px">
    <h4 style="margin:0 0 4px;font-size:14px">结果评分</h4>
    <p class="hint" style="margin:0 0 12px">结果是否符合预期、是否解决了您的问题？</p>
    <div class="stars">${stars}</div>
    <div class="rate-tags">${tags.map(x=>`<span class="chip" data-action="toggle-rtag">${x}</span>`).join('')}</div>
    <textarea class="input" placeholder="补充说明（可选）" style="min-height:54px"></textarea>
    <div style="margin-top:10px"><button class="btn primary sm" data-action="submit-rating">提交评分</button>
      ${t.rating?`<span class="hint" style="margin-left:10px">当前评分：${t.rating} 星</span>`:''}</div>
  </div>`;
}
function followupBlock(t){
  const linked = t.followupChatId ? CHATS.find(c=>c.id===t.followupChatId) : null;
  return `<div class="card card-pad">
    <h4 style="margin:0 0 4px;font-size:14px">继续分析</h4>
    <p class="hint" style="margin:0 0 14px">提出问题后将跳转到「运维问答」，并把本报告作为历史对话上下文一起带过去，在那里继续深入分析；涉及线上操作时会先请您确认。</p>
    ${linked?`<div class="callout" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px">
      <span>本报告已在「运维问答」中继续分析（${linked.msgs.filter(m=>m.role==='user').length} 个追问）。</span>
      <button class="btn sm" data-action="open-followup" data-id="${linked.id}">打开对话 →</button></div>`:''}
    <div class="composer" style="border-top:none;padding-top:0;margin-top:0">
      <textarea class="input" id="fu-input" placeholder="例如：为什么判断是连接池耗尽？ / 重新采集近一小时的 order-svc 日志"></textarea>
      <button class="btn primary" data-action="send-fu">${ICON.send} 在运维问答中继续</button>
    </div></div>`;
}

/* ---- KB ---- */
function renderKB(){
  setTitle('运维问答');
  if(!state.activeChat && !state.kbNew) state.activeChat=CHATS[0]?.id||null;
  const list=CHATS.map(c=>`<div class="ci ${c.id===state.activeChat?'on':''}" data-action="open-chat" data-id="${c.id}">
    <div class="ct">${esc(c.title)}</div><div class="cm">${c.updated}</div></div>`).join('');
  const chat=CHATS.find(c=>c.id===state.activeChat);
  const msgs=chat?chat.msgs.map(renderKBMsg).join(''):'';
  C().innerHTML=`
    <div class="page-head"><div><h1 class="t">运维问答</h1><p class="d">直接提问运维相关问题，系统自动识别为运维问答（带引用）或 CVE 查询（返回修复版本表格）。也可从故障报告「继续分析」跳转而来，携带报告作为上下文。</p></div></div>
    <div class="kb-layout">
      <div class="card card-pad" style="padding:14px">
        <button class="btn primary sm" style="width:100%;justify-content:center;margin-bottom:12px" data-action="new-chat">${ICON.plus} 新会话</button>
        <div class="chatlist">${list}</div>
      </div>
      <div class="card card-pad" style="display:flex;flex-direction:column">
        <div class="chatwrap">
          <div class="msgs" id="kb-msgs">${msgs||emptyKB()}</div>
          <div class="chips" style="margin:10px 0 4px">
            <button class="chip" data-action="kb-chip">CVE-2024-1086 影响哪些版本？</button>
            <button class="chip" data-action="kb-chip">openEuler 怎么配置时间同步？</button>
            <button class="chip" data-action="kb-chip">如何排查内核内存泄漏？</button>
          </div>
          <div class="composer">
            <textarea class="input" id="kb-input" placeholder="输入问题，回车或点发送…"></textarea>
            <button class="btn primary" data-action="send-kb">${ICON.send} 发送</button>
          </div>
        </div>
      </div>
    </div>`;
  const mw=$('#kb-msgs'); if(mw) mw.scrollTop=mw.scrollHeight;
}
function emptyKB(){return `<div class="empty"><div class="ei">💬</div>开始一个新问题吧<br><span class="hint">试试下面的示例</span></div>`;}
function renderKBMsg(m){
  if(m.role==='user') return `<div class="msg user"><div class="ava">我</div><div class="bubble">${esc(m.text)}</div></div>`;
  if(m.kind==='reportref'){
    const t=TASKS.find(x=>x.id===m.taskId); const r=t&&t.report; const sm=r&&r.summary;
    if(!t||!sm) return '';
    return `<div class="msg bot"><div class="ava">AI</div><div class="bubble" style="max-width:none;background:var(--surface-2);border-color:#c4e7e1">
      <span class="intent-tag qa">关联报告 · 上下文</span>
      <div style="font-weight:600">${esc(t.title)} · <span class="mono">${esc(t.id)}</span></div>
      <div class="kv" style="margin-top:8px;grid-template-columns:64px 1fr">
        <div class="key">根因</div><div>${esc(sm.rootcause)}</div>
        <div class="key">影响</div><div>${esc(sm.impact)}</div>
        <div class="key">置信度</div><div>${esc(sm.confidence)}</div>
      </div>
      <div class="hint" style="margin-top:8px">已将该报告作为分析上下文载入，可基于它继续提问。 <a href="#" data-action="goto-task" data-id="${t.id}">查看完整报告 →</a></div>
    </div></div>`;
  }
  if(m.kind==='action'){
    return `<div class="msg bot"><div class="ava">AI</div><div class="action-card">
      <div class="ah">${ICON.bolt} 需要执行新的诊断动作</div>
      <div>${esc(m.text)}</div><ul>${m.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      ${m.confirmed?'<div class="hint" style="color:var(--ok)">✓ 已确认并执行完成</div>':
      `<div class="acbtns"><button class="btn primary sm" data-action="confirm-act" data-mid="${m._mid}">确认执行</button>
       <button class="btn sm" data-action="cancel-act" data-mid="${m._mid}">改为仅解释</button></div>`}
    </div></div>`;
  }
  if(m.kind==='inlineprog'){
    return `<div class="msg bot"><div class="ava">AI</div><div class="inline-prog">
      <div style="display:flex;justify-content:space-between"><b>子任务执行中</b><span class="pill run">运行中</span></div>
      <div class="prog-bar" style="margin-top:10px"><i style="width:${m.progress}%"></i></div>
      <div class="hint" style="margin-top:6px">${esc(m.label)}</div></div></div>`;
  }
  if(m.kind==='cve'){
    const c=m.cve;
    const rows=c.rows.map(r=>`<tr><td class="mono">${esc(r.ver)}</td><td class="mono">${esc(r.fixed)}</td>
      <td>${r.status==='已修复'?'<span class="pill ok">已修复</span>':r.status==='不受影响'?'<span class="pill queue">不受影响</span>':esc(r.status)}</td></tr>`).join('');
    return `<div class="msg bot"><div class="ava">AI</div><div class="bubble" style="max-width:none">
      <span class="intent-tag cve">CVE 查询</span>
      <div style="font-weight:600;font-size:14px">${esc(c.id)} · <span style="color:var(--danger)">${esc(c.severity)} (CVSS ${esc(c.cvss)})</span></div>
      <div class="hint" style="margin:4px 0 10px;color:var(--text-2)">${esc(c.desc)}</div>
      <table class="data"><thead><tr><th>openEuler 版本</th><th>修复版本</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="cite"><a href="#" data-action="noop">${ICON.link} 查看安全公告详情</a></div>
    </div></div>`;
  }
  if(m.kind==='plain' || (m.html && !m.kind)){
    return `<div class="msg bot"><div class="ava">AI</div><div class="bubble" style="max-width:none">${m.html||esc(m.text)}</div></div>`;
  }
  // qa
  const cites=(m.cites||[]).map(c=>`<a href="${c.u}" data-action="noop">${ICON.link} ${esc(c.t)}</a>`).join('');
  return `<div class="msg bot"><div class="ava">AI</div><div class="bubble" style="max-width:none">
    <span class="intent-tag qa">运维问答</span>
    <div>${m.html||esc(m.text)}</div>
    ${cites?`<div class="cite"><div class="ct">引用来源</div>${cites}</div>`:''}
  </div>`;
}

/* ============ TASK SIMULATION ============ */
function startTask(t){
  TASKS.unshift(t);
  state.activeTask=t; render();
  t.status='running'; t.stageIdx=0; t.progress=4; t.logs=[]; t._logOpen=true;
  const log=(txt)=>{t.logs.push({time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),txt});};
  const seq = t.type==='online'
    ? [['数据采集','SSH 连接已建立，开始采集系统指标…'],['数据采集','采集 dmesg / journalctl / 网络连接状态'],
       ['数据分析','解析 23,481 条日志，提取异常模式'],['故障定位','关联指标与日志，定位疑似根因'],['生成报告','汇总结论与处置建议，渲染报告']]
    : [['数据采集','解压并校验上传日志（2 个文件）'],['数据分析','解析日志时间线，识别异常区间'],
       ['数据分析','匹配已知故障特征库'],['故障定位','定位根因与受影响范围'],['生成报告','生成诊断报告']];
  log('任务已创建，进入执行队列');
  let i=0;
  const tick=()=>{
    if(i<seq.length){
      const [stage,msg]=seq[i];
      t.stageIdx=STAGES.indexOf(stage);
      t.progress=Math.round(((i+1)/(seq.length+1))*100);
      log(msg);
      if(state.activeTask===t) renderTaskDetail();
      refreshRunBadge();
      i++; setTimeout(tick, 950);
    } else {
      t.status='completed'; t.stageIdx=5; t.progress=100;
      t.report = t.type==='online'?reportNginx():reportOOM();
      log('诊断完成，报告已生成 ✓');
      if(state.activeTask===t) renderTaskDetail();
      refreshRunBadge(); toast('诊断完成，报告已生成');
    }
  };
  setTimeout(tick,800);
}

/* ============ ANALYSIS / Q&A LOGIC ============ */
const ACTION_KW=['采集','重新','重跑','检查','看看','查看','抓取','分析一下','网络','配置','扩大','再','追加','跑一下','执行'];
function isActionRequest(txt){return ACTION_KW.some(k=>txt.includes(k));}

// 从故障报告的「继续分析」跳转到「运维问答」：携带报告 + 用户输入作为历史对话
function sendFollowup(){
  const t=state.activeTask; if(!t) return;
  const inp=$('#fu-input'); const txt=inp?inp.value.trim():'';
  let chat = t.followupChatId ? CHATS.find(c=>c.id===t.followupChatId) : null;
  if(!chat){
    chat={id:'c'+Date.now(), title:'继续分析 · '+t.title.slice(0,14), updated:'刚刚',
      linkedTaskId:t.id, msgs:[{role:'bot',kind:'reportref',taskId:t.id}]};
    CHATS.unshift(chat); t.followupChatId=chat.id;
  }
  if(txt) chat.msgs.push({role:'user',text:txt});
  // 跳转到运维问答
  state.view='kb'; state.activeTask=null; state.activeChat=chat.id; state.kbNew=false;
  document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='kb'));
  renderKB();
  toast(txt?'已带着报告跳转到「运维问答」':'已打开运维问答，可继续提问');
  if(txt){ setTimeout(()=>{ respondInChat(chat,txt); chat.updated='刚刚'; renderKB(); },650); }
  else { const ki=$('#kb-input'); if(ki) ki.focus(); }
}

// 统一的问答响应：自动识别意图（CVE / 运维问答 / 报告解读 / 动作）
function respondInChat(chat, text){
  const linkedTask = chat.linkedTaskId ? TASKS.find(t=>t.id===chat.linkedTaskId) : null;
  const isCVE = /cve[- ]?\d{4}[- ]?\d+/i.test(text) || text.toLowerCase().includes('cve');
  if(linkedTask && isActionRequest(text)){
    chat.msgs.push({role:'bot',kind:'action',_mid:'m'+Date.now(),
      text:'这条请求需要在目标环境执行新的诊断动作。计划如下，确认后我会执行：',
      steps:['在 '+(linkedTask.type==='online'?linkedTask.target:'已上传日志')+' 上采集相关数据',
             '解析结果并与本报告关联','将新发现追加到对话，并补充进报告']});
  } else if(isCVE){
    chat.msgs.push({role:'bot',kind:'cve',cve:cveData()});
  } else if(linkedTask){
    const sm=linkedTask.report&&linkedTask.report.summary;
    chat.msgs.push({role:'bot',kind:'qa',
      text:`根据报告判断，根因为「${esc(sm?sm.rootcause:'见报告')}」。依据是「关键指标深度分析」中的特征——上游 connect() 大量超时、TIME_WAIT 远高于基线，说明新建连接被拒、连接无法复用，这正是连接池耗尽的典型表现，而非网络链路本身故障。若希望进一步确认，可以让我重新采集相关日志做交叉验证。`,
      cites:[{t:'诊断报告 · '+linkedTask.id,u:'#'}]});
  } else if(text.includes('时间同步')||text.includes('chrony')||text.includes('ntp')){
    chat.msgs.push({role:'bot',kind:'qa',
      text:'openEuler 默认使用 <b>chrony</b> 进行时间同步：编辑 <span class="mono">/etc/chrony.conf</span> 配置 <span class="mono">server</span> 时间源，执行 <span class="mono">systemctl enable --now chronyd</span> 启动并设为开机自启，再用 <span class="mono">chronyc sources -v</span> 验证同步状态。容器或离线环境可指向内网 NTP 服务器。',
      cites:[{t:'时间同步配置 · openEuler 文档',u:'#'},{t:'chrony 命令参考',u:'#'}]});
  } else {
    chat.msgs.push({role:'bot',kind:'qa',
      text:'排查内核内存泄漏建议：先用 <b>free -h</b> / <span class="mono">/proc/meminfo</span> 观察 Slab 与 KernelStack 是否持续增长，再用 <b>slabtop</b> 找出增长最快的对象；必要时启用 <b>kmemleak</b> 读取 <span class="mono">/sys/kernel/debug/kmemleak</span> 获取疑似泄漏栈。生产环境建议先建立基线，避免把缓存当成泄漏。',
      cites:[{t:'内核内存调测指南 · openEuler 文档',u:'#'},{t:'kmemleak 使用说明',u:'#'}]});
  }
}

// 动作确认 → 内联子任务进度 → 追加发现
function confirmChatAction(mid){
  const chat=CHATS.find(c=>c.id===state.activeChat); if(!chat)return;
  const am=chat.msgs.find(m=>m._mid===mid); if(am)am.confirmed=true;
  const prog={role:'bot',kind:'inlineprog',progress:10,label:'正在采集 order-svc 近一小时日志…'};
  chat.msgs.push(prog); renderKB();
  let p=10; const iv=setInterval(()=>{
    p+=Math.round(15+Math.random()*15);
    if(p>=100){p=100;clearInterval(iv);
      const idx=chat.msgs.indexOf(prog);
      chat.msgs[idx]={role:'bot',kind:'plain',html:'<b>补充分析完成</b><br>近一小时 order-svc 日志显示：连接获取等待 (pool wait) 平均 1.8s，最大并发连接稳定在上限 50。已将「连接池上限不足」证据追加至报告「关键现象」。建议将连接池上限提升至 120 并启用复用。'};
      renderKB(); toast('补充分析已追加到报告');
    } else { prog.progress=p; prog.label=p<60?'正在采集 order-svc 近一小时日志…':'分析采集结果并关联报告…'; renderKB(); }
  },700);
}
function cancelChatAction(mid){
  const chat=CHATS.find(c=>c.id===state.activeChat); if(!chat)return;
  const am=chat.msgs.find(m=>m._mid===mid); if(am)am.confirmed=true;
  chat.msgs.push({role:'bot',kind:'plain',text:'好的，仅做解释：该操作会在目标主机执行采集命令，可能带来轻微负载。如暂不执行，我可以基于现有报告继续说明判断依据。'});
  renderKB();
}

function sendKB(text){
  state.kbNew=false;
  let chat=CHATS.find(c=>c.id===state.activeChat);
  if(!chat){chat={id:'c'+Date.now(),title:text.slice(0,18),updated:'刚刚',msgs:[]};CHATS.unshift(chat);state.activeChat=chat.id;}
  chat.msgs.push({role:'user',text});
  if(chat.msgs.filter(m=>m.role==='user').length===1 && !chat.linkedTaskId) chat.title=text.slice(0,18);
  renderKB();
  setTimeout(()=>{ respondInChat(chat,text); chat.updated='刚刚'; renderKB(); },650);
}

/* ============ EVENT DELEGATION ============ */
document.addEventListener('click',e=>{
  const navBtn=e.target.closest('.nav-item[data-view]');
  if(navBtn){ setView(navBtn.dataset.view); return; }
  const el=e.target.closest('[data-action]'); if(!el)return;
  const a=el.dataset.action;
  switch(a){
    case 'login':{
      const u=$('#lg-user').value||'user@demo.io';
      state.user={name:u.split('@')[0], email:u};
      $('#side-name').textContent=state.user.name;
      $('#side-ava').textContent=state.user.name[0].toUpperCase();
      $('#login').style.display='none'; $('#app').hidden=false;
      setView('ops'); toast('已登录：'+state.user.name); break;}
    case 'logout':{ $('#app').hidden=true; $('#login').style.display='flex'; break;}
    case 'new-task':{ state.wizard={type:'online',conn:null}; state.activeTask=null; setView('ops'); break;}
    case 'cancel-wizard':{ state.wizard=null; render(); break;}
    case 'wiz-type':{ saveWizard(); state.wizard.type=el.dataset.t; state.wizard.conn=null; renderWizard(); break;}
    case 'test-conn':{
      const b=$('#btn-conn'); b.textContent='测试中…'; b.disabled=true;
      saveWizard();
      setTimeout(()=>{ state.wizard.conn='ok'; renderWizard(); toast('连通成功，可开始诊断'); },1100); break;}
    case 'pick-file':{ saveWizard(); state.wizard.files=state.wizard.files||[];
      const names=['messages-0610.log','dmesg.tar.gz','app-error.log','syslog.zip'];
      state.wizard.files.push(names[state.wizard.files.length%names.length]); renderWizard(); break;}
    case 'rm-file':{ state.wizard.files.splice(+el.dataset.i,1); renderWizard(); break;}
    case 'start-online':{
      saveWizard(); const w=state.wizard;
      const t={id:'t-'+(1043+TASKS.length),title:w.desc||'在线诊断任务',type:'online',target:w.ip||'192.168.10.21',time:w.time,status:'queued',progress:0,rating:0};
      state.wizard=null; startTask(t); toast('任务已创建，开始后台诊断'); break;}
    case 'start-offline':{
      saveWizard(); const w=state.wizard;
      const t={id:'t-'+(1043+TASKS.length),title:w.desc||'离线日志分析',type:'offline',files:w.files,time:w.time,status:'queued',progress:0,rating:0};
      state.wizard=null; startTask(t); toast('任务已创建，开始分析日志'); break;}
    case 'open-task': case 'goto-task':{
      state.view='ops'; document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='ops'));
      state.activeTask=TASKS.find(t=>t.id===el.dataset.id); state.wizard=null; renderTaskDetail(); break;}
    case 'back-list':{ state.activeTask=null; renderOpsList(); break;}
    case 'cancel-task':{ state.activeTask.status='failed'; state.activeTask.fail='任务已被用户取消。'; renderTaskDetail(); refreshRunBadge(); break;}
    case 'retry':{ const t=state.activeTask; const nt={...t,status:'queued',progress:0,fail:null}; TASKS=TASKS.filter(x=>x.id!==t.id); startTask(nt); break;}
    case 'toggle-log':{ state.activeTask._logOpen=!state.activeTask._logOpen; renderTaskDetail(); break;}
    case 'set-star':{ state.activeTask.rating=+el.dataset.v; renderTaskDetail(); break;}
    case 'toggle-rtag':{ el.classList.toggle('sel'); break;}
    case 'submit-rating':{ toast('评分已提交，感谢反馈'); break;}
    case 'send-fu':{ sendFollowup(); break;}
    case 'open-followup':{
      state.view='kb'; state.activeTask=null; state.kbNew=false;
      document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='kb'));
      state.activeChat=el.dataset.id; renderKB(); break;}
    case 'confirm-act':{ confirmChatAction(el.dataset.mid); break;}
    case 'cancel-act':{ cancelChatAction(el.dataset.mid); break;}
    case 'new-chat':{ state.activeChat=null; state.kbNew=true; renderKB(); break;}
    case 'open-chat': case 'goto-chat':{
      state.view='kb'; state.kbNew=false; document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='kb'));
      state.activeChat=el.dataset.id; renderKB(); break;}
    case 'kb-chip':{ sendKB(el.textContent.trim()); break;}
    case 'send-kb':{ const inp=$('#kb-input'); const v=inp.value.trim(); if(v){inp.value='';sendKB(v);} break;}
    case 'noop':{ e.preventDefault(); toast('演示原型：此处为占位操作'); break;}
    case 'toc':{ e.preventDefault(); const tg=document.getElementById(el.dataset.target); if(tg) tg.scrollIntoView({behavior:'smooth',block:'start'}); break;}
  }
});

// hover stars
document.addEventListener('mouseover',e=>{
  const s=e.target.closest('.star[data-action="set-star"]'); if(s&&state.activeTask){state.activeTask._ratingHover=+s.dataset.v;renderTaskDetail();}
});
document.addEventListener('mouseout',e=>{
  const s=e.target.closest('.star[data-action="set-star"]'); if(s&&state.activeTask){state.activeTask._ratingHover=0;renderTaskDetail();}
});
// enter to send
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    if(e.target.id==='kb-input'){e.preventDefault();const v=e.target.value.trim();if(v){e.target.value='';sendKB(v);}}
    if(e.target.id==='fu-input'){e.preventDefault();sendFollowup();}
    if(e.target.id==='lg-pass'){document.querySelector('[data-action="login"]').click();}
  }
});
function saveWizard(){
  if(!state.wizard)return; const w=state.wizard;
  const g=id=>$(id)?$(id).value:undefined;
  if($('#w-desc'))w.desc=$('#w-desc').value;
  if($('#w-time'))w.time=$('#w-time').value;
  if($('#w-ip'))w.ip=$('#w-ip').value;
}
